# Tests and vets the hook binary sources on every PR and push to main.

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./cli/

      - name: Test
        run: go test -race ./cli/

      - name: Bootstrap script syntax
        run: |
          sh -n trustguard/hooks/trustguard-hook.sh
          sh trustguard/hooks/trustguard-hook.cmd

      - name: Kandji MDM scripts
        run: make kandji-syntax

      - name: Plugin manifests
        run: |
          python3 -c "import json; json.load(open('trustguard/.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('trustguard/hooks/hooks.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json; d=json.load(open('mdm/claude/managed-settings.json')); assert d['enabledPlugins']['trustguard@neuraltrust'] is True; assert 'pluginConfigs' not in d; p=json.load(open('trustguard/.claude-plugin/plugin.json')); assert 'mcpServers' not in p and 'userConfig' not in p"
          # Claude Code loads hooks/hooks.json on its own; declaring it here too
          # makes plugin load fail with "Duplicate hooks file detected".
          python3 -c "import json; p=json.load(open('trustguard/.claude-plugin/plugin.json')); assert 'hooks' not in p, 'plugin.json must not declare hooks; hooks/hooks.json loads automatically'"
